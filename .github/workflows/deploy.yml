name: Deploy to Cloudflare Workers

# Pushing to GitHub does not deploy on its own. This is the piece that was
# missing: it builds the Vite app and uploads dist/ to the Worker named in
# wrangler.jsonc ("moood") on every push to main.
on:
  push:
    branches: [main]
    # Documentation-only edits do not change the built site. Kept to a
    # single unambiguous pattern: negation (!) is not dependable in
    # paths-ignore, and a filter that silently never matches would stop
    # deploys firing at all — the exact failure this workflow exists to fix.
    paths-ignore:
      - '**/*.md'
  # Adds a "Run workflow" button so a deploy can be triggered by hand
  # without pushing an empty commit.
  workflow_dispatch:

# A newer push supersedes an in-flight deploy rather than racing it.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs a current Node; 22 matches what the site is built
          # and tested against locally.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail here rather than shipping a broken build to production.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Cloudflare rejects any single asset over 25 MiB, and the failure
      # arrives late and unhelpfully. Catching it here names the file.
      - name: Check asset size limits
        run: |
          limit=$((25 * 1024 * 1024))
          over=$(find dist -type f -size +${limit}c -printf '%s\t%p\n' || true)
          if [ -n "$over" ]; then
            echo "::error::These assets exceed Cloudflare's 25 MiB per-file limit:"
            echo "$over" | awk -F'\t' '{printf "  %.2f MB  %s\n", $1/1048576, $2}'
            exit 1
          fi
          echo "All $(find dist -type f | wc -l) files are within the per-file limit."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # accountId is optional when the token is scoped to one account;
          # set the secret if the token can see more than one.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
